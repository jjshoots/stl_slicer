[project]
name = "stl-slicer"
version = "0.1.0"
description = "Partition STL meshes into print-bed-sized pieces with interlocking joints; local web app with 3D viewer."
authors = [{ name = "jet" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "numpy>=2.0",
    "trimesh>=4.4",
    "manifold3d>=3.0",
    "typer>=0.12",
]

[project.scripts]
stl-slicer = "stl_slicer.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stl_slicer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/stl_slicer"]
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.importlinter]
root_package = "stl_slicer"

[[tool.importlinter.contracts]]
name = "Layers: api -> service -> core; io -> core"
type = "layers"
layers = ["stl_slicer.cli", "stl_slicer.api", "stl_slicer.service", "stl_slicer.io", "stl_slicer.core"]

[[tool.importlinter.contracts]]
name = "core.models is a leaf"
type = "forbidden"
source_modules = ["stl_slicer.core.models"]
forbidden_modules = ["stl_slicer.core.geometry", "stl_slicer.core.planning", "stl_slicer.core.joints", "stl_slicer.core.slicing", "stl_slicer.core.pipeline", "stl_slicer.io", "stl_slicer.service", "stl_slicer.api"]

[[tool.importlinter.contracts]]
name = "api never touches the geometry kernel"
type = "forbidden"
source_modules = ["stl_slicer.api", "stl_slicer.service"]
forbidden_modules = ["manifold3d", "trimesh"]
